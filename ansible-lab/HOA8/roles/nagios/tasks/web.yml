---
- name: Enable Apache modules rewrite and cgi (Debian family)
  ansible.builtin.command: "a2enmod {{ item }}"
  loop:
    - rewrite
    - cgi
  register: a2enmod_result
  changed_when: "'already enabled' not in a2enmod_result.stdout"
  notify: restart apache
  when: ansible_os_family == "Debian"

- name: Add the Apache user to the nagios group
  ansible.builtin.user:
    name: "{{ apache_user }}"
    groups: nagios
    append: true
  notify: restart apache

- name: Create the Nagios web admin login
  ansible.builtin.command: >
    htpasswd -bc {{ nagios_install_dir }}/etc/htpasswd.users
    {{ nagios_admin_user }} {{ nagios_admin_password | quote }}
  args:
    creates: "{{ nagios_install_dir }}/etc/htpasswd.users"
  no_log: true

- name: Enable and start Apache and Nagios
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - "{{ apache_service }}"
    - nagios
