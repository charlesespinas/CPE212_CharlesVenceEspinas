---
- name: Load OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

- name: Install build dependencies
  ansible.builtin.include_tasks: deps.yml

- name: Open firewall and relax SELinux (RedHat family only)
  ansible.builtin.include_tasks: redhat.yml
  when: ansible_os_family == "RedHat"

- name: Build and install Nagios Core and Plugins
  ansible.builtin.include_tasks: build.yml

- name: Configure Apache, web login and services
  ansible.builtin.include_tasks: web.yml
