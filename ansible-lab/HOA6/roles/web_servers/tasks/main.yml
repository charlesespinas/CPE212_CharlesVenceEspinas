---
- name: Install Apache and PHP
  package:
    name:
      - "{{ 'httpd' if ansible_distribution == 'CentOS' else 'apache2' }}"
      - php
    state: present

- name: Start Apache service
  service:
    name: "{{ 'httpd' if ansible_distribution == 'CentOS' else 'apache2' }}"
    state: started
    enabled: true
