---
- hosts: all
  become: true
  tasks:

#    - name: Update repository in ubuntu
 #     ansible.builtin.apt:
  #      upgrade: dist
   #     update_cache: yes
    #  when: ansible_distribution == "Ubuntu"

   # - name: Update repository in centos
    #  ansible.builtin.yum:
     #   upgrade: dist
      #  update_cache: yes
     # when: ansible_distribution == "CentOS"

    - name: installing  important utilities in prometheus in ubuntu
      ansible.builtin.apt:
        name:
          - wget
          - tar
          - curl
        state: present
      when: ansible_distribution == "Ubuntu"

    - name: installing important utilities in prometheus in centos
      ansible.builtin.yum:
        name:
          - wget
          - tar
          - curl
        state: present
      when: ansible_distribution == "CentOS"


    - name: Create a group
      ansible.builtin.group:
        name: prometheus
        state: present
 

    - name: Create a user and assign it to a group
      user:
        name: prometheus
        groups: prometheus
        append: yes

    - name: Create Prometheus Directory
      ansible.builtin.file:
        path: /etc/prometheus
        state: directory
        mode: '755'

    - name: Create a Prometheus Libraries
      ansible.builtin.file:
        path: /var/lib/prometheus
        state: directory
        mode: '755'

    - name: Download Prometheus
      ansible.builtin.get_url:
          url: https://github.com/prometheus/prometheus/releases/download/v2.55.1/prometheus-2.55.1.linux-amd64.tar.gz
          dest: /tmp
          mode: '755'

    - name: Extract Prometheus
      ansible.builtin.unarchive:
        src: /tmp/prometheus-2.55.1.linux-amd64.tar.gz
        dest: /tmp
        remote_src: yes
        mode: '755'
        owner: prometheus
        group: prometheus

    - name: Install Prometheus binaries (prometheus)
      ansible.builtin.copy:
        src: /tmp/prometheus-2.55.1.linux-amd64/prometheus
        dest: /usr/local/bin/
        remote_src: yes
        mode: '755'
        owner: prometheus
        group: prometheus

    - name: Install Prometheus Binaries (promtool)
      ansible.builtin.copy:
        src: /tmp/prometheus-2.55.1.linux-amd64/promtool
        dest: /usr/local/bin/
        mode: '755'
        remote_src: yes
        owner: prometheus
        group: prometheus

    - name: Install prometheus configuration file
      ansible.builtin.copy:
        src: /tmp/prometheus-2.55.1.linux-amd64/prometheus.yml
        dest: /etc/prometheus
        remote_src: yes
        owner: prometheus
        group: prometheus

    - name: Install prometheus console
      ansible.builtin.copy:
        src: /tmp/prometheus-2.55.1.linux-amd64/consoles
        dest: /etc/prometheus
        remote_src: yes
        owner: prometheus
        group: prometheus

    - name: Install prometheus console libraries
      ansible.builtin.copy:
        src: /tmp/prometheus-2.55.1.linux-amd64/console_libraries
        dest: /etc/prometheus
        remote_src: yes
        owner: prometheus
        group: prometheus
